<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' @@SCRIPT_HASHES@@ blob:; worker-src 'self' blob:; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src data: blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<!--@@PWA_HEAD@@ Web公開用ビルド（site/）でのみ manifest・アイコンのリンクが入る -->
<title>PDFリーダー</title>
<style>
:root{
  --bg:#e6e8ec; --bar:#ffffff; --fg:#1f2328; --muted:#6b7280; --line:#d9dce1;
  --accent:#2563eb; --accent-fg:#ffffff; --hover:#eef0f3; --panel:#ffffff;
  --shadow:0 8px 28px rgba(0,0,0,.18); --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --bar:#22252a; --fg:#e8e9ec; --muted:#9aa0aa; --line:#363a41;
    --accent:#5b8cff; --hover:#2d3137; --panel:#262a30; --shadow:0 8px 28px rgba(0,0,0,.55);
  }
}
@media (max-width:600px){ :root{ --pad:6px; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  position:fixed;inset:0;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI","Yu Gothic UI",Meiryo,sans-serif;
  font-size:14px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
input,textarea{font:inherit}
.hidden{display:none !important}

/* ---------- ヘッダー ---------- */
header{
  flex:none;display:flex;align-items:center;gap:4px;
  padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));
  padding-top:calc(6px + env(safe-area-inset-top));
  background:var(--bar);border-bottom:1px solid var(--line);z-index:20;
}
.btn{
  height:38px;min-width:38px;padding:0 8px;border:0;border-radius:9px;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none;
}
.btn svg{width:21px;height:21px;flex:none}
@media (hover:hover){ .btn:hover:not(:disabled){background:var(--hover)} }
.btn:active:not(:disabled){background:var(--hover)}
.btn.on{background:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-fg);padding:0 16px}
.btn.danger{color:#e03131}
#docTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:0 6px}
.nav{display:flex;align-items:center;gap:2px}
#pageInput{
  width:64px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--fg);font-size:15px;-webkit-user-select:text;user-select:text;
}
#pageTotal{color:var(--muted);min-width:44px;white-space:nowrap}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
@media (max-width:480px){
  .lbl{display:none}
  #docTitle{padding:0 2px;font-size:13px}
  #pageInput{width:54px}
  .sep{display:none}
}

/* ---------- メイン ---------- */
#main{flex:1;min-height:0;display:flex;position:relative}
#viewer{
  flex:1;min-width:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;overscroll-behavior:contain;
}
#pages{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:100%;min-height:100%;width:max-content;padding:var(--pad);
}
#pages.mode-scroll{justify-content:flex-start;gap:12px}
.spread{display:flex;flex-direction:row;align-items:center;gap:0}
.spread.rtl{flex-direction:row-reverse}
.page{position:relative;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.28);flex:none;overflow:hidden}
.spread .page + .page{box-shadow:0 1px 5px rgba(0,0,0,.28), inset 0 0 0 0 transparent}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
body.t-marker .page svg.ink, body.t-pen .page svg.ink, body.t-eraser .page svg.ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body.t-eraser .page svg.ink{cursor:cell}
body.t-memo .page svg.ink, body.t-sticky .page svg.ink{pointer-events:auto;touch-action:pan-x pan-y;cursor:copy}
body.pen-only .page svg.ink{touch-action:pan-x pan-y}
.notes{position:absolute;inset:0;pointer-events:none}
.note{
  position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;border-radius:6px 6px 6px 2px;
  pointer-events:auto;touch-action:none;cursor:pointer;color:#3b3b3b;
  box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;
}
.note svg{width:18px;height:18px}
.note.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{transform:scale(1.6);box-shadow:0 0 0 8px rgba(37,99,235,.35)}}
/* 付箋：ページ上に本文とリンクを表示する。大きさはページの拡大率（--s）に合わせる */
.sticky{
  position:absolute;pointer-events:auto;touch-action:none;cursor:grab;color:#222;
  width:calc(var(--s,1) * 150px);min-height:calc(var(--s,1) * 40px);
  padding:calc(var(--s,1) * 6px) calc(var(--s,1) * 7px);
  font-size:calc(var(--s,1) * 10px);line-height:1.45;border-radius:calc(var(--s,1) * 2px);
  box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:pre-wrap;overflow-wrap:anywhere;
}
.sticky .sticky-link{display:block;margin-top:calc(var(--s,1) * 4px);color:#0b57d0;text-decoration:underline;word-break:break-all;cursor:pointer}
.sticky.flash{animation:flash2 1.2s ease 2}
@keyframes flash2{50%{box-shadow:0 0 0 6px rgba(37,99,235,.5)}}

#empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--muted);text-align:center;padding:24px;
}
#empty .big{width:72px;height:72px;opacity:.5}
#empty .btn{height:46px;font-size:16px}
body.dragover #viewer{outline:3px dashed var(--accent);outline-offset:-10px}

/* ---------- サイドバー ---------- */
#sidebar{
  width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
@media (max-width:760px){
  #sidebar{position:absolute;right:0;top:0;bottom:0;width:min(88vw,340px);box-shadow:var(--shadow);z-index:15}
}
.tabs{display:flex;align-items:center;gap:4px;padding:6px;border-bottom:1px solid var(--line)}
.tabs .tab{flex:1;height:34px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.tabs .tab.on{background:var(--hover);font-weight:600}
.sidebody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
.sidebody .empty{color:var(--muted);text-align:center;padding:24px 8px;line-height:1.7}
.pg-group{margin:4px 0 10px}
.pg-head{
  display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;
  padding:6px 8px;border-radius:8px;font-weight:600;text-align:left;
}
.pg-head .meta{font-weight:400;color:var(--muted);font-size:12px}
@media (hover:hover){ .pg-head:hover,.memo-item:hover,.ol-item:hover{background:var(--hover)} }
.memo-item{
  display:flex;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;
  padding:7px 8px 7px 14px;border-radius:8px;align-items:flex-start;
}
.memo-item .dot{width:12px;height:12px;border-radius:3px;flex:none;margin-top:3px}
.memo-item .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;white-space:pre-wrap;word-break:break-all}
#outlineList ul{list-style:none;margin:0;padding:0 0 0 12px}
#outlineList > ul{padding-left:0}
.ol-item{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;line-height:1.4}

/* ---------- ポップオーバー ---------- */
.pop{
  position:absolute;top:8px;right:8px;z-index:30;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:14px;width:min(340px,calc(100vw - 16px));
  max-height:calc(100% - 16px);overflow:auto;
}
.pop h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.pop .row{margin-bottom:14px}
.pop .row:last-child{margin-bottom:0}
.seg{display:flex;background:var(--hover);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--bar);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;line-height:1.45}
.check input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.check.dim{opacity:.4;pointer-events:none}
.zoomrow{display:flex;align-items:center;gap:6px}
.zoomrow .btn{border:1px solid var(--line)}
#zoomLabel{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.menu{padding:6px;width:min(280px,calc(100vw - 16px))}
.menu .mi{display:flex;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left}
@media (hover:hover){ .menu .mi:hover{background:var(--hover)} }
.menu .mi.danger{color:#e03131}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* ---------- ページスライダー ---------- */
#pageBar{
  flex:none;position:relative;z-index:21;display:flex;align-items:center;
  padding:2px max(14px,env(safe-area-inset-right)) 2px max(14px,env(safe-area-inset-left));
  background:var(--bar);border-top:1px solid var(--line);
}
body.bars-hidden #pageBar{display:none}
.pb-track{position:relative;flex:1;height:34px;display:flex;align-items:center}
#pageSlider{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;background:transparent;cursor:pointer}
#pageSlider:focus{outline:none}
#pageSlider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
#pageSlider::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#pageSlider::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bar);box-shadow:0 1px 4px rgba(0,0,0,.35);
}
#pageSlider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bar);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#pageSlider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
.pb-marks{position:absolute;left:10px;right:10px;top:50%;height:0;pointer-events:none}
.pb-marks i{position:absolute;top:5px;left:calc(var(--f) * 100%);width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#f08c00}
#pageBar.rtl .pb-marks i{left:calc((1 - var(--f)) * 100%)}
#pageBubble{
  position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;
}
.pb-thumb{display:flex;align-items:center;justify-content:center;min-height:40px}
.pb-thumb canvas{display:block;box-shadow:0 0 0 1px var(--line)}
#pageBubbleLabel{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- ツールバー（下） ---------- */
footer{
  flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background:var(--bar);border-top:1px solid var(--line);z-index:20;
}
.toolset{display:flex;align-items:center;gap:2px}
.toolset .btn{min-width:44px}
.toolset [data-tool="eraser"]{touch-action:none}
.btn.pressing{animation:press .7s linear forwards}
@keyframes press{to{background:rgba(224,49,49,.4)}}
.opts{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:330px}
@media (max-width:640px){ .opts{order:-1;width:100%;min-width:0} }
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch.on{border-color:var(--fg)}
.sizes{display:flex;gap:2px;margin-left:4px}
.size{width:32px;height:32px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.size i{display:block;background:currentColor;border-radius:4px;width:18px}
.size.on{background:var(--hover);outline:1px solid var(--line)}
.chip{height:32px;border:1px solid var(--line);padding:0 10px;font-size:13px}
.hint{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(8vh,env(safe-area-inset-top)) 10px 10px}
.sheet{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);padding:14px;display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.sheet textarea{
  width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;
  background:var(--bg);color:var(--fg);font-size:16px;line-height:1.6;-webkit-user-select:text;user-select:text;
}
.sheet-foot{display:flex;align-items:center;gap:8px}
.sheet-foot .grow{flex:1}
.note-colors{display:flex;gap:6px}
.note-colors .swatch{width:24px;height:24px;border-radius:6px}
.meta-time{font-size:12px;color:var(--muted);font-weight:400}
.link-fields{display:flex;flex-direction:column;gap:6px}
.link-fields input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;
  background:var(--bg);color:var(--fg);font-size:16px;-webkit-user-select:text;user-select:text;
}
.memo-item .link{color:var(--accent);font-size:12px;word-break:break-all}
.memo-item .dot.sq{border-radius:1px}

/* ---------- 全画面表示（ツールバーを隠す） ---------- */
body.bars-hidden header, body.bars-hidden footer{display:none}
#fullExit{
  position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:25;
  width:40px;height:40px;border-radius:50%;background:rgba(30,30,30,.55);color:#fff;opacity:.7;display:none;
}
body.bars-hidden #fullExit{display:inline-flex}

#toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;
  font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center;
}
#toast.show{opacity:1}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:rgba(0,0,0,.08)}
.spinner{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="t-view">

<header>
  <label class="btn" title="PDFを開く" for="fileInput"><span data-icon="open"></span><span class="lbl">開く</span></label>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
  <div id="docTitle"></div>
  <div class="nav">
    <button class="btn" id="btnLeft" disabled><span data-icon="left"></span></button>
    <input id="pageInput" type="text" inputmode="numeric" autocomplete="off" disabled aria-label="ページ番号">
    <span id="pageTotal">/ 0</span>
    <button class="btn" id="btnRight" disabled><span data-icon="right"></span></button>
  </div>
  <div class="sep"></div>
  <button class="btn" id="btnView" title="表示設定"><span data-icon="book"></span><span class="lbl">表示</span></button>
  <button class="btn" id="btnSide" title="メモ一覧・目次"><span data-icon="list"></span></button>
  <button class="btn" id="btnFull" title="全画面表示 (F)"><span data-icon="expand"></span></button>
  <button class="btn" id="btnMore" title="その他"><span data-icon="more"></span></button>
</header>

<div id="main">
  <div id="viewer">
    <div id="pages"></div>
    <div id="empty">
      <span data-icon="file" class="big"></span>
      <div>PDFファイルを選択してください<br><small>（PCではドラッグ＆ドロップでも開けます）</small></div>
      <label class="btn primary" for="fileInput"><span data-icon="open"></span>PDFを開く</label>
    </div>
  </div>

  <aside id="sidebar" class="hidden">
    <div class="tabs">
      <button class="tab on" data-tab="memos">メモ・書き込み</button>
      <button class="tab" data-tab="outline">目次</button>
      <button class="btn" id="sideClose" title="閉じる"><span data-icon="close"></span></button>
    </div>
    <div class="sidebody" id="memoList"></div>
    <div class="sidebody hidden" id="outlineList"></div>
  </aside>

  <div class="pop hidden" id="viewPop">
    <div class="row">
      <h4>表示モード</h4>
      <div class="seg" id="segMode">
        <button data-v="single">1ページ</button>
        <button data-v="scroll">スクロール</button>
        <button data-v="spread">見開き</button>
      </div>
    </div>
    <div class="row">
      <h4>綴じ方向（見開きの並び・ページ送り方向）</h4>
      <div class="seg" id="segDir">
        <button data-v="rtl">右開き（縦書き）</button>
        <button data-v="ltr">左開き（横書き）</button>
      </div>
    </div>
    <div class="row">
      <label class="check" id="coverWrap"><input type="checkbox" id="chkCover">見開き時、扉ページ（1ページ目）を単独で表示する</label>
    </div>
    <div class="row">
      <h4>拡大・縮小</h4>
      <div class="zoomrow">
        <button class="btn" id="zoomOut" title="縮小"><span data-icon="minus"></span></button>
        <span id="zoomLabel">100%</span>
        <button class="btn" id="zoomIn" title="拡大"><span data-icon="plus"></span></button>
      </div>
      <div class="seg" id="segFit" style="margin-top:8px">
        <button data-v="page">ページ全体</button>
        <button data-v="width">幅に合わせる</button>
      </div>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="chkPenOnly">ペン（Apple Pencil）のみで書き込む<br>（指はスクロール・ページ送りに使う）</label>
    </div>
  </div>

  <div class="pop menu hidden" id="morePop">
    <button class="mi" id="miExport">注釈を書き出す（JSON）</button>
    <button class="mi" id="miImport">注釈を読み込む（JSON）</button>
    <input type="file" id="importInput" accept="application/json,.json" hidden>
    <button class="mi" id="miEmbed">注釈をPDFに埋め込んで保存</button>
    <hr>
    <button class="mi" id="miFull">全画面表示</button>
    <hr>
    <button class="mi danger" id="miClear">この文書の注釈をすべて削除</button>
  </div>

  <div id="loading" class="hidden"><div class="spinner"></div></div>
</div>

<div id="pageBar" class="hidden">
  <div class="pb-track">
    <input type="range" id="pageSlider" min="1" max="1" step="1" value="1" aria-label="ページ移動">
    <div class="pb-marks" id="pageMarks"></div>
  </div>
  <div id="pageBubble" class="hidden"><div class="pb-thumb" id="pageThumb"></div><div id="pageBubbleLabel"></div></div>
</div>

<footer>
  <div class="toolset">
    <button class="btn on" data-tool="view" title="閲覧 (V)"><span data-icon="hand"></span></button>
    <button class="btn" data-tool="marker" title="ラインマーカー (M)"><span data-icon="marker"></span></button>
    <button class="btn" data-tool="pen" title="ペン (P)"><span data-icon="pen"></span></button>
    <button class="btn" data-tool="eraser" title="消しゴム (E)・長押しでこのページの注釈をすべて削除"><span data-icon="eraser"></span></button>
    <button class="btn" data-tool="memo" title="メモ (N)"><span data-icon="note"></span></button>

/* ================= 状態 ================= */
const S = {

let undoStack = [];
let saveT = null;

let io = null, io2 = null;
const visible = new Set();

}

async function openFile(file) {

function calcMax() {

async function loadAllSizes(pdf) {
  let changed = false;
  for (let i = 2; i <= S.N; i++) {
    if (S.pdf !== pdf) return;
    if (S.known[i - 1]) continue;
    try {
      const p = await pdf.getPage(i);
      const v = p.getViewport({ scale: 1 });
      const s = S.sizes[i - 1];
      if (Math.abs(s.w - v.width) > 0.5 || Math.abs(s.h - v.height) > 0.5) { S.sizes[i - 1] = { w: v.width, h: v.height }; changed = true; }
      S.known[i - 1] = true;
    } catch (e) {}
    if (changed && i % 40 === 0) { calcMax(); updateLayout(); changed = false; }
  }
  if (changed && S.pdf === pdf) { calcMax(); updateLayout(); }
}

async function ensureSizes(list) {
  let changed = false;
  for (const n of list) {
    if (S.known[n - 1]) continue;
    const p = await S.pdf.getPage(n);
    const v = p.getViewport({ scale: 1 });
    const s = S.sizes[n - 1];
    if (Math.abs(s.w - v.width) > 0.5 || Math.abs(s.h - v.height) > 0.5) { S.sizes[n - 1] = { w: v.width, h: v.height }; changed = true; }

async function renderEl(el) {

    st.classList.toggle('on', S.straight);
  } else {
    const msg = {
      view: S.mode === 'scroll' ? 'スクロールで閲覧・ピンチで拡大' : (isTouch ? '左右スワイプ／画面端タップでページ送り' : '←→キー・ホイール・画面端クリックでページ送り'),
      eraser: 'なぞった書き込みを消します（ボタン長押しでこのページの注釈をすべて削除）',
      memo: 'ページをタップしてメモを追加（メモはドラッグで移動）',
      sticky: 'ページをタップして付箋を追加（ドラッグで移動・リンクはタップで開く）'
    };
    hint.textContent = msg[t] || '';
  }
}
$('#swatches').addEventListener('click', e => {

/* ---- 消しゴムの長押し：表示中のページの注釈をすべて削除（確認ダイアログあり） ---- */
const eraserBtn = $('[data-tool="eraser"]');
let lpT = null, lpFired = false;
eraserBtn.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  lpFired = false; clearTimeout(lpT);
  eraserBtn.classList.add('pressing');
  lpT = setTimeout(() => { lpT = null; lpFired = true; eraserBtn.classList.remove('pressing'); clearPageAnn(); }, 700);
});
const cancelLongPress = () => { clearTimeout(lpT); lpT = null; eraserBtn.classList.remove('pressing'); };
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => eraserBtn.addEventListener(t, cancelLongPress));
eraserBtn.addEventListener('contextmenu', e => e.preventDefault());
// 長押しの後に続くクリックで消しゴムツールに切り替わらないようにする
eraserBtn.addEventListener('click', e => { if (lpFired) { lpFired = false; e.stopImmediatePropagation(); } }, true);

function clearPageAnn() {
  if (!S.pdf) { toast('先にPDFを開いてください'); return; }
  const list = S.mode === 'spread' ? groupPages(groupIndexOf(S.current)) : [S.current];
  const label = list.join('-') + 'ページ';
  const targets = list.filter(n => annCount(n));
  if (!targets.length) { toast(label + 'には注釈がありません'); return; }
  const cnt = targets.reduce((a, n) => a + annCount(n), 0);
  if (!confirm(`${label}のすべての注釈を削除します。\n（マーカー・ペン・メモ・付箋 ${cnt}件。削除後も「元に戻す」で復元できます）`)) return;
  for (const n of targets) { pushUndo(n); for (const k of KINDS) delete ann[k][n]; refreshPage(n); }
  saveAnn(); renderSideList();
  toast(`${label}の注釈を削除しました`);
}

/* ================= 書き込み（ペン・マーカー・消しゴム・メモ） ================= */
let drawing = null, memoTap = null, noteDrag = null;

function toPage(ev, el) {
  const r = el.getBoundingClientRect();
  const s = S.sizes[el._n - 1];
  return [clamp((ev.clientX - r.left) / r.width * s.w, 0, s.w), clamp((ev.clientY - r.top) / r.height * s.h, 0, s.h)];
}
function pushUndo(n) {
  undoStack.push({ n, data: Object.fromEntries(KINDS.map(k => [k, clone(ann[k][n] || [])])) });
  if (undoStack.length > 200) undoStack.shift();
  updateUndoBtn();
}
function updateUndoBtn() { $('#btnUndo').disabled = !undoStack.length; }
function tidy(n) {
  for (const k of KINDS) if (ann[k][n] && !ann[k][n].length) delete ann[k][n];
}
function undo() {
  const u = undoStack.pop(); updateUndoBtn();
  if (!u) return;
  for (const k of KINDS) ann[k][u.n] = u.data[k]; tidy(u.n);
  saveAnn(); refreshPage(u.n); renderSideList();
  if (!pageEls.has(u.n)) toast(`${u.n}ページの操作を取り消しました`);
}
$('#btnUndo').addEventListener('click', undo);

function cancelDrawing() {
  if (!drawing) return;
  if (drawing.path) drawing.path.remove();
  if (drawing.mode === 'erase' && drawing.changed) { /* 消去は確定扱い */ saveAnn(); renderSideList(); }
  drawing = null;
}

pagesEl.addEventListener('pointerdown', e => {
  // メモアイコン・付箋（付箋のリンク部分はブラウザ標準のリンク動作に任せる）
  if (e.target.closest('.sticky-link')) return;
  const nb = e.target.closest('.note, .sticky');
  if (nb) {
    const el = nb.closest('.page');
    const n = el._n, kind = nb.classList.contains('sticky') ? 'stickies' : 'notes';
    const note = (ann[kind][n] || []).find(x => x.id === nb.dataset.id);
    if (!note) return;
    e.preventDefault(); e.stopPropagation();
    try { nb.setPointerCapture(e.pointerId); } catch (_) {}
    const p = toPage(e, el);
    noteDrag = { pid: e.pointerId, el, n, kind, note, btn: nb, sx: e.clientX, sy: e.clientY, off: [note.x - p[0], note.y - p[1]], moved: false };
    return;
  }
  const svg = e.target.closest('svg.ink');
  if (!svg || !isDrawTool() || drawing || pinch) return;
  if (S.penOnly && e.pointerType === 'touch') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = svg.parentElement, n = el._n;
  const p = toPage(e, el);

  if (S.tool === 'memo' || S.tool === 'sticky') {
    memoTap = { pid: e.pointerId, el, n, p, x: e.clientX, y: e.clientY, kind: S.tool === 'sticky' ? 'stickies' : 'notes' };
    return;
  }
  e.preventDefault();
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === 'touch') lastTouchDraw = Date.now();
  if (S.tool === 'eraser') {
    drawing = { mode: 'erase', pid: e.pointerId, ptype: e.pointerType, el, n, last: p, changed: false };
    eraseAt(drawing, p);
    return;
  }
  const t = S.tool;
  const w = (t === 'marker' ? MARKER_W : PEN_W)[S.size[t]];
  const straight = t === 'marker' && S.straight;
  const path = document.createElementNS(SVGNS, 'path');
  drawing = { mode: 'draw', pid: e.pointerId, ptype: e.pointerType, el, n, t, straight, st: { id: uid(), t, c: S.color[t], w, s: straight, p: [p] }, path };
  const tmp = makePath(drawing.st);
  for (const a of tmp.getAttributeNames()) path.setAttribute(a, tmp.getAttribute(a));
  svg.append(path);
});

window.addEventListener('pointermove', e => {
  if (noteDrag && e.pointerId === noteDrag.pid) {
    const d = noteDrag;
    if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
    if (!d.moved) { d.moved = true; pushUndo(d.n); }
    const p = toPage(e, d.el), s = S.sizes[d.n - 1];
    d.note.x = r1(clamp(p[0] + d.off[0], 0, s.w - 10)); d.note.y = r1(clamp(p[1] + d.off[1], 0, s.h - 10));
    d.btn.style.left = (d.note.x / s.w * 100) + '%';
    d.btn.style.top = (d.note.y / s.h * 100) + '%';
    return;
  }
  if (memoTap && e.pointerId === memoTap.pid) {
    if (Math.hypot(e.clientX - memoTap.x, e.clientY - memoTap.y) > 10) memoTap = null;
    return;
  }
  if (!drawing || e.pointerId !== drawing.pid) return;
  e.preventDefault();
  if (drawing.ptype === 'touch') lastTouchDraw = Date.now();
  let evs = [e];
  if (drawing.mode === 'draw' && !drawing.straight && e.getCoalescedEvents) {
    const c = e.getCoalescedEvents(); if (c && c.length) evs = c;
  }
  if (drawing.mode === 'erase') {
    for (const ev of evs) {
      const p = toPage(ev, drawing.el);
      const r = 10 / drawing.el._scale;
      const dist = Math.hypot(p[0] - drawing.last[0], p[1] - drawing.last[1]);
      const steps = Math.max(1, Math.ceil(dist / r));
      for (let i = 1; i <= steps; i++) {
        eraseAt(drawing, [drawing.last[0] + (p[0] - drawing.last[0]) * i / steps, drawing.last[1] + (p[1] - drawing.last[1]) * i / steps]);
      }
      drawing.last = p;
    }
    return;
  }
  const pts = drawing.st.p;
  if (drawing.straight) {
    const p0 = pts[0];
    let [x, y] = toPage(e, drawing.el);
    const dx = x - p0[0], dy = y - p0[1];
    if (Math.abs(dy) < Math.abs(dx) * 0.15) y = p0[1];       // 水平にスナップ
    else if (Math.abs(dx) < Math.abs(dy) * 0.15) x = p0[0];  // 垂直にスナップ（縦書き用）
    drawing.st.p = [p0, [x, y]];
  } else {
    const minD = 0.8 / drawing.el._scale;
    for (const ev of evs) {
      const p = toPage(ev, drawing.el);
      const l = pts[pts.length - 1];
      if (Math.hypot(p[0] - l[0], p[1] - l[1]) >= minD) pts.push(p);
    }
  }
  drawing.path.setAttribute('d', pathD(drawing.st.p));
}, { passive: false });

function endPointer(e, cancelled) {
  if (noteDrag && e.pointerId === noteDrag.pid) {
    const d = noteDrag; noteDrag = null;
    if (d.moved) { saveAnn(); renderSideList(); }
    else if (!cancelled) openEditor(d.n, d.note, false, d.kind);
    return;
  }
  if (memoTap && e.pointerId === memoTap.pid) {
    const m = memoTap; memoTap = null;
    if (!cancelled) openEditor(m.n, { id: uid(), x: r1(m.p[0]), y: r1(m.p[1]), text: '', c: NOTE_COLORS[0], t: Date.now() }, true, m.kind);
    return;
  }
  if (!drawing || e.pointerId !== drawing.pid) return;
  const d = drawing; drawing = null;
  if (d.mode === 'erase') {
    if (d.changed) { saveAnn(); renderSideList(); }
    return;
  }
  d.path.remove();
  const st = d.st;
  if (d.straight) {
    const [a, b] = st.p;
    if (!b || Math.hypot(b[0] - a[0], b[1] - a[1]) < 3) return;
  }
  st.p = st.p.map(([x, y]) => [r1(x), r1(y)]);
  pushUndo(d.n);
  (ann.strokes[d.n] = ann.strokes[d.n] || []).push(st);
  saveAnn(); drawAnn(d.el); renderSideList();
}
window.addEventListener('pointerup', e => endPointer(e, false));
window.addEventListener('pointercancel', e => {
  if (drawing && e.pointerId === drawing.pid && drawing.mode === 'draw') { cancelDrawing(); return; }
  endPointer(e, true);
});

function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(ax + t * dx - px, ay + t * dy - py);
}
function hitStroke(st, x, y, r) {
  const R = r + st.w / 2, p = st.p;
  if (p.length === 1) return Math.hypot(p[0][0] - x, p[0][1] - y) <= R;
  for (let i = 0; i < p.length - 1; i++) if (distSeg(x, y, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]) <= R) return true;
  return false;
}
function eraseAt(d, p) {
  const list = ann.strokes[d.n];
  if (!list || !list.length) return;
  const r = 10 / d.el._scale;
  const keep = list.filter(st => !hitStroke(st, p[0], p[1], r));
  if (keep.length !== list.length) {
    if (!d.changed) { pushUndo(d.n); d.changed = true; }
    ann.strokes[d.n] = keep; tidy(d.n);
    drawAnn(d.el);
  }
}

/* ================= メモ編集 ================= */
let editing = null;
function openEditor(n, note, isNew, kind = 'notes') {
  editing = { n, note, isNew, kind, color: note.c };
  const sticky = kind === 'stickies';
  $('#memoTitle').textContent = `${sticky ? '付箋' : 'メモ'}（${n}ページ）`;
  $('#memoText').placeholder = sticky ? '付箋に書く内容を入力' : 'メモを入力';
  $('#linkFields').classList.toggle('hidden', !sticky);
  $('#linkUrl').value = note.url || ''; $('#linkText').value = note.lt || '';
  $('#memoTime').textContent = note.t ? new Date(note.u || note.t).toLocaleString('ja-JP', { dateStyle: 'short', timeStyle: 'short' }) : '';
  $('#memoText').value = note.text || '';
  $('#memoDelete').classList.toggle('hidden', isNew);
  renderNoteColors();
  $('#memoModal').classList.remove('hidden');
  $('#memoText').focus();
}
function renderNoteColors() {
  $('#noteColors').innerHTML = NOTE_COLORS.map(c => `<button class="swatch${editing.color === c ? ' on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('');
}
$('#noteColors').addEventListener('click', e => {
  const b = e.target.closest('.swatch'); if (!b || !editing) return;
  editing.color = b.dataset.c; renderNoteColors();
});
function closeEditor() { $('#memoModal').classList.add('hidden'); editing = null; $('#memoText').blur(); }
$('#memoCancel').addEventListener('click', closeEditor);
$('#memoModal').addEventListener('pointerdown', e => { if (e.target.id === 'memoModal') closeEditor(); });
$('#memoText').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEditor();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#memoSave').click();
});
$('#memoSave').addEventListener('click', () => {
  if (!editing) return;
  const { n, note, isNew, kind } = editing;
  const text = $('#memoText').value;
  let url = '', lt = '';
  if (kind === 'stickies') {
    url = safeUrl($('#linkUrl').value);
    if (url === null) { toast('リンクは https:// ・ http:// ・ mailto: で始まるものを入力してください', 3500); $('#linkUrl').focus(); return; }
    lt = url ? $('#linkText').value.trim() : '';
  }
  const list = ann[kind][n] || (ann[kind][n] = []);
  if (!text.trim() && !url) {
    if (!isNew) { pushUndo(n); ann[kind][n] = list.filter(x => x.id !== note.id); }
  } else if (isNew || text !== note.text || editing.color !== note.c || url !== (note.url || '') || lt !== (note.lt || '')) {
    pushUndo(n);
    note.text = text; note.c = editing.color; note.u = Date.now();
    if (kind === 'stickies') { if (url) { note.url = url; note.lt = lt; } else { delete note.url; delete note.lt; } }
    if (isNew) list.push(note);
  }
  tidy(n); saveAnn(); refreshPage(n); renderSideList(); closeEditor();
});
$('#memoDelete').addEventListener('click', () => {
  if (!editing) return;
  const { n, note, kind } = editing;
  pushUndo(n);
  ann[kind][n] = (ann[kind][n] || []).filter(x => x.id !== note.id);
  tidy(n); saveAnn(); refreshPage(n); renderSideList(); closeEditor();
  toast(`${kind === 'stickies' ? '付箋' : 'メモ'}を削除しました（元に戻す で復元できます）`);
});

/* ================= サイドバー ================= */
const sidebar = $('#sidebar');
function toggleSide(on) {
  sidebar.classList.toggle('hidden', !on);
  $('#btnSide').classList.toggle('on', on);
}
$('#btnSide').addEventListener('click', () => { closePops(); toggleSide(sidebar.classList.contains('hidden')); });
$('#sideClose').addEventListener('click', () => toggleSide(false));
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('#memoList').classList.toggle('hidden', t.dataset.tab !== 'memos');
  $('#outlineList').classList.toggle('hidden', t.dataset.tab !== 'outline');
}));
const isNarrow = () => window.matchMedia('(max-width:760px)').matches;

let sideT;
function renderSideList() { clearTimeout(sideT); sideT = setTimeout(renderSideListNow, 60); }
function renderSideListNow() {
  updateMarks();
  const box = $('#memoList');
  if (!S.pdf) { box.innerHTML = '<p class="empty">PDFを開くと、メモや書き込みの一覧が表示されます</p>'; return; }
  const sorted = annPages();
  if (!sorted.length) {
    box.innerHTML = '<p class="empty">まだメモや書き込みはありません。<br>下のツールバーからマーカー・ペン・メモを選んで書き込めます。</p>';
    return;
  }
  box.textContent = '';
  for (const n of sorted) {
    const g = document.createElement('div'); g.className = 'pg-group';
    const strokes = ann.strokes[n] || [];
    const mk = strokes.filter(s => s.t === 'marker').length, pn = strokes.length - mk;
    const notes = (ann.notes[n] || []).map(x => ({ x, kind: 'notes' }));
    const stickies = (ann.stickies[n] || []).map(x => ({ x, kind: 'stickies' }));
    const items = [...notes, ...stickies].sort((a, b) => a.x.y - b.x.y || a.x.x - b.x.x);
    const meta = [mk ? `マーカー${mk}` : '', pn ? `ペン${pn}` : '', notes.length ? `メモ${notes.length}` : '', stickies.length ? `付箋${stickies.length}` : ''].filter(Boolean).join('・');
    const h = document.createElement('button'); h.className = 'pg-head';
    h.innerHTML = `<span>${n}ページ</span><span class="meta">${meta}</span>`;
    h.addEventListener('click', () => { goTo(n); if (isNarrow()) toggleSide(false); });
    g.append(h);
    for (const { x: note, kind } of items) {
      const it = document.createElement('button'); it.className = 'memo-item';
      const dot = document.createElement('span'); dot.className = 'dot' + (kind === 'stickies' ? ' sq' : ''); dot.style.background = note.c;
      const body = document.createElement('span');
      const tx = document.createElement('span'); tx.className = 'txt'; tx.textContent = (kind === 'stickies' ? '［付箋］' : '') + note.text;
      body.append(tx);
      if (note.url) { const ln = document.createElement('div'); ln.className = 'link'; ln.textContent = '🔗 ' + (note.lt || note.url); body.append(ln); }
      it.append(dot, body);
      it.addEventListener('click', () => jumpToNote(n, note));
      g.append(it);
    }
    box.append(g);
  }
}
function jumpToNote(n, note) {
  goTo(n);
  if (isNarrow()) toggleSide(false);
  requestAnimationFrame(() => {
    const el = pageEls.get(n); if (!el) return;
    if (S.mode === 'scroll' || viewer.scrollHeight > viewer.clientHeight) {
      const s = S.sizes[n - 1];
      viewer.scrollTop = el.offsetTop + (note.y / s.h) * el.offsetHeight - viewer.clientHeight / 3;
    }
    const b = el._notes.querySelector(`[data-id="${CSS.escape(note.id)}"]`);
    if (b) { b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
  });
}

async function buildOutline() {
  const box = $('#outlineList');
  box.innerHTML = '<p class="empty">読み込み中…</p>';
  const pdf = S.pdf;
  let ol = null;
  try { ol = await pdf.getOutline(); } catch (e) {}
  if (S.pdf !== pdf) return;
  if (!ol || !ol.length) { box.innerHTML = '<p class="empty">このPDFには目次（しおり）がありません</p>'; return; }
  const mk = items => {
    const ul = document.createElement('ul');
    for (const it of items) {
      const li = document.createElement('li');
      const b = document.createElement('button'); b.className = 'ol-item'; b.textContent = it.title || '(無題)';
      b.addEventListener('click', () => navDest(it.dest));
      li.append(b);
      if (it.items && it.items.length) li.append(mk(it.items));
      ul.append(li);
    }
    return ul;
  };
  box.textContent = '';
  box.append(mk(ol));
}
async function navDest(dest) {
  try {
    if (typeof dest === 'string') dest = await S.pdf.getDestination(dest);
    if (!Array.isArray(dest)) return;
    const ref = dest[0];
    const idx = typeof ref === 'object' && ref ? await S.pdf.getPageIndex(ref) : ref;
    goTo(idx + 1);
    if (isNarrow()) toggleSide(false);
  } catch (e) { console.warn(e); }
}

$('#segDir').addEventListener('click', e => {

  if (S.pdf && S.mode !== 'scroll') buildView();
  updateViewPop(); updatePageUI();
});

/* ---- その他メニュー ---- */
function download(name, data, type = 'application/json') {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$('#miExport').addEventListener('click', () => {
  closePops();
  if (!S.pdf) { toast('PDFを開いてください'); return; }
  const data = { app: 'pdf-reader', version: 1, fingerprint: S.key, name: S.name, exported: new Date().toISOString(), annotations: ann };
  download(S.name.replace(/\.pdf$/i, '') + '_注釈.json', JSON.stringify(data, null, 1));
});
$('#miImport').addEventListener('click', () => {
  closePops();
  if (!S.pdf) { toast('先に対象のPDFを開いてください'); return; }
  $('#importInput').click();
});
// 読み込む注釈ファイルは外部から来たデータとして扱い、必要な項目だけを型・範囲を確かめて取り込む
const COLOR_RE = /^#[0-9a-f]{6}$/i, ID_RE = /^[a-z0-9]{1,40}$/i;
const num = v => typeof v === 'number' && Number.isFinite(v);
function cleanStroke(st) {
  if (!st || typeof st !== 'object' || !Array.isArray(st.p) || st.p.length > 20000) return null;
  const p = st.p.filter(q => Array.isArray(q) && num(q[0]) && num(q[1])).map(([x, y]) => [r1(x), r1(y)]);
  if (!p.length || !COLOR_RE.test(st.c) || !num(st.w) || st.w <= 0 || st.w > 100) return null;
  return { id: ID_RE.test(st.id) ? st.id : uid(), t: st.t === 'marker' ? 'marker' : 'pen', c: st.c, w: st.w, s: !!st.s, p };
}
function cleanNote(nt) {
  if (!nt || typeof nt !== 'object' || typeof nt.text !== 'string' || !num(nt.x) || !num(nt.y) || !COLOR_RE.test(nt.c)) return null;
  const o = { id: ID_RE.test(nt.id) ? nt.id : uid(), x: r1(nt.x), y: r1(nt.y), text: nt.text.slice(0, 20000), c: nt.c, t: num(nt.t) ? nt.t : Date.now() };
  if (num(nt.u)) o.u = nt.u;
  return o;
}
function cleanSticky(st) {
  const o = cleanNote(Object.assign({ text: '' }, st));
  if (!o) return null;
  const url = st.url == null ? '' : safeUrl(st.url);
  if (url) { o.url = url; if (typeof st.lt === 'string') o.lt = st.lt.slice(0, 500); }
  return o.text || o.url ? o : null;
}
$('#importInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const a = data.annotations || data;
    if (!a || KINDS.every(k => typeof a[k] !== 'object')) throw new Error('形式が正しくありません');
    if (data.fingerprint && data.fingerprint !== S.key && !confirm('このファイルは別のPDFの注釈のようです。読み込みますか？')) return;
    let cnt = 0;
    for (const kind of KINDS) {
      const clean = { strokes: cleanStroke, notes: cleanNote, stickies: cleanSticky }[kind];
      for (const [n, list] of Object.entries(a[kind] || {})) {
        if (!/^\d+$/.test(n) || +n < 1 || +n > S.N || !Array.isArray(list)) continue;
        const cur = ann[kind][n] || (ann[kind][n] = []);
        const ids = new Set(cur.map(x => x.id));
        for (const raw of list) {
          const item = clean(raw);
          if (item && !ids.has(item.id)) { cur.push(item); ids.add(item.id); cnt++; }
        }
        tidy(n);
      }
    }
    saveAnn(); for (const el of pageEls.values()) drawAnn(el); renderSideList();
    toast(`${cnt}件の注釈を読み込みました`);
  } catch (err) { toast('読み込みに失敗しました: ' + err.message, 3500); }
});
/* ---- 注釈をPDFに埋め込む ---- */
// ペン・マーカーはインク注釈、メモはノート注釈（標準のPDF注釈）として書き込むので、他のアプリでも表示・編集できる
function loadPdfLib() {
  if (!window.PDFLib) {
    const sc = document.createElement('script'); sc.textContent = $('#pdflib-src').textContent; document.head.appendChild(sc);
  }
  return window.PDFLib;
}
const hexToRgb = c => [1, 3, 5].map(i => +(parseInt(c.slice(i, i + 2), 16) / 255).toFixed(3));
const f3 = v => +v.toFixed(3);
function pdfPathOps(p) { // 画面の描画（pathD）と同じ曲線を PDF の 3 次ベジェで描く
  const xy = q => `${f3(q[0])} ${f3(q[1])}`;
  if (p.length === 1) return `${xy(p[0])} m ${f3(p[0][0] + 0.05)} ${f3(p[0][1])} l`;
  if (p.length === 2) return `${xy(p[0])} m ${xy(p[1])} l`;
  let ops = `${xy(p[0])} m`, cur = p[0];
  for (let i = 1; i < p.length - 1; i++) {
    const c = p[i], e = [(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2];
    const c1 = [cur[0] + (c[0] - cur[0]) * 2 / 3, cur[1] + (c[1] - cur[1]) * 2 / 3];
    const c2 = [e[0] + (c[0] - e[0]) * 2 / 3, e[1] + (c[1] - e[1]) * 2 / 3];
    ops += ` ${xy(c1)} ${xy(c2)} ${xy(e)} c`; cur = e;
  }
  return ops + ` ${xy(p[p.length - 1])} l`;
}
// 付箋の見た目（画面の .sticky と同じ寸法：幅150・余白6/7・文字10・行間1.45、単位はページ座標）を画像として描く
const STICKY = { w: 150, padX: 7, padY: 6, font: 10, lh: 14.5, gap: 4, minH: 40 };
function layoutSticky(st) {
  const g = document.createElement('canvas').getContext('2d');
  g.font = `${STICKY.font}px ${getComputedStyle(document.body).fontFamily}`;
  const maxW = STICKY.w - STICKY.padX * 2, lines = [];
  const wrap = (str, link) => {
    for (const para of str.split('\n')) {
      let cur = '';
      for (const ch of para) {
        if (cur && g.measureText(cur + ch).width > maxW) { lines.push({ t: cur, link }); cur = ch; } else cur += ch;
      }
      lines.push({ t: cur, link });
    }
  };
  const url = safeUrl(st.url);
  if (st.text) wrap(st.text, false);
  if (url) wrap(st.lt || url, true);
  const textLines = lines.filter(l => !l.link).length, linkLines = lines.length - textLines;
  const linkTop = STICKY.padY + textLines * STICKY.lh + (textLines && linkLines ? STICKY.gap : 0);
  const h = Math.max(STICKY.minH, linkTop + linkLines * STICKY.lh + STICKY.padY);
  return { lines, url, h, linkTop, linkLines, textLines, font: g.font };
}
async function stickyPng(st, L, k = 4) {
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(STICKY.w * k); cv.height = Math.ceil(L.h * k);
  const g = cv.getContext('2d');
  g.scale(k, k);
  g.fillStyle = st.c; g.fillRect(0, 0, STICKY.w, L.h);
  g.font = L.font; g.textBaseline = 'middle';
  L.lines.forEach((l, i) => {
    const y = (l.link ? L.linkTop + (i - L.textLines) * STICKY.lh : STICKY.padY + i * STICKY.lh) + STICKY.lh / 2;
    g.fillStyle = l.link ? '#0b57d0' : '#222';
    g.fillText(l.t, STICKY.padX, y);
    if (l.link) g.fillRect(STICKY.padX, y + STICKY.font * 0.55, g.measureText(l.t).width, 0.6);
  });
  return new Uint8Array(await (await new Promise(r => cv.toBlob(r, 'image/png'))).arrayBuffer());
}

async function buildAnnotatedPdf() {
  const { PDFDocument, PDFHexString, PDFString } = loadPdfLib();
  const doc = await PDFDocument.load(new Uint8Array(await S.file.arrayBuffer()), { updateMetadata: false });
  const ctx = doc.context, pages = doc.getPages();
  const gsCache = {};
  const extGState = op => gsCache[op] || (gsCache[op] = ctx.register(ctx.obj({ Type: 'ExtGState', CA: op, ca: op, BM: op < 1 ? 'Multiply' : 'Normal' })));
  const form = (ops, bbox, resources = {}, matrix = [1, 0, 0, 1, 0, 0]) =>
    ctx.register(ctx.flateStream(ops, { Type: 'XObject', Subtype: 'Form', BBox: bbox, Matrix: matrix, Resources: resources }));
  const pdfDate = t => PDFString.fromDate(new Date(t || Date.now()));

  function inkAnnot(st, toPdf) {
    const pts = st.p.map(toPdf), m = st.w / 2 + 1;
    const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
    const rect = [Math.min(...xs) - m, Math.min(...ys) - m, Math.max(...xs) + m, Math.max(...ys) + m].map(f3);
    const op = st.t === 'marker' ? 0.45 : 1, rgb = hexToRgb(st.c);
    const cap = st.t === 'marker' && st.s ? 0 : 1;
    const ap = form(`q /GS0 gs ${rgb.join(' ')} RG ${f3(st.w)} w ${cap} J 1 j ${pdfPathOps(pts)} S Q`, rect, { ExtGState: { GS0: extGState(op) } });
    return ctx.obj({
      Type: 'Annot', Subtype: 'Ink', Rect: rect, InkList: [pts.flat().map(f3)], C: rgb, CA: op,
      BS: { W: st.w }, F: 4, NM: PDFString.of(st.id), M: pdfDate(), AP: { N: ap }
    });
  }
  function noteAnnot(nt, toPdf, rotation) {
    const [x, y] = toPdf([nt.x, nt.y]), rgb = hexToRgb(nt.c);
    const a = rotation * Math.PI / 180, cs = Math.round(Math.cos(a)), sn = Math.round(Math.sin(a));
    // 回転したページでもアイコンが正立して見えるよう、ページの回転を打ち消す向きに描く
    const ap = form(`q ${rgb.join(' ')} rg 0.3 0.3 0.3 RG 0.8 w 0.5 0.5 19 19 re B 1.4 w 5 14 m 15 14 l 5 10 m 15 10 l 5 6 m 12 6 l S Q`,
      [0, 0, 20, 20], {}, [cs, sn, -sn, cs, 0, 0]);
    return ctx.obj({
      Type: 'Annot', Subtype: 'Text', Rect: [x - 10, y - 10, x + 10, y + 10].map(f3), Contents: PDFHexString.fromText(nt.text),
      C: rgb, Name: 'Comment', Open: false, F: 4 | 8 | 16, NM: PDFString.of(nt.id), M: pdfDate(nt.u || nt.t), AP: { N: ap }
    });
  }

  // 付箋：画像を外観にしたスタンプ注釈（本文とURLは注釈の内容にも入れる）＋リンク部分に URI リンク注釈
  async function stickyAnnots(st, toPdf, rotation) {
    const L = layoutSticky(st);
    const img = await doc.embedPng(await stickyPng(st, L));
    const box = (x0, y0, x1, y1) => {
      const a = toPdf([x0, y0]), b = toPdf([x1, y1]);
      return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])].map(f3);
    };
    const a = rotation * Math.PI / 180, cs = Math.round(Math.cos(a)), sn = Math.round(Math.sin(a));
    const ap = form(`q ${STICKY.w} 0 0 ${f3(L.h)} 0 0 cm /Im0 Do Q`, [0, 0, STICKY.w, f3(L.h)], { XObject: { Im0: img.ref } }, [cs, sn, -sn, cs, 0, 0]);
    const out = [ctx.obj({
      Type: 'Annot', Subtype: 'Stamp', Rect: box(st.x, st.y, st.x + STICKY.w, st.y + L.h),
      Contents: PDFHexString.fromText([st.text, L.url].filter(Boolean).join('\n')),
      F: 4, NM: PDFString.of(st.id), M: pdfDate(st.u || st.t), AP: { N: ap }
    })];
    if (L.url) out.push(ctx.obj({
      Type: 'Annot', Subtype: 'Link', Border: [0, 0, 0], F: 4,
      Rect: box(st.x, st.y + L.linkTop, st.x + STICKY.w, st.y + L.linkTop + L.linkLines * STICKY.lh),
      A: { Type: 'Action', S: 'URI', URI: PDFString.of(L.url) }
    }));
    return out;
  }

  let count = 0;
  for (let n = 1; n <= S.N; n++) {
    const strokes = ann.strokes[n] || [], notes = ann.notes[n] || [], stickies = ann.stickies[n] || [];
    if (!strokes.length && !notes.length && !stickies.length) continue;
    const vp = (await S.pdf.getPage(n)).getViewport({ scale: 1 }); // 画面座標 → PDF座標（回転・余白を考慮）
    const toPdf = ([x, y]) => vp.convertToPdfPoint(x, y);
    const node = pages[n - 1].node;
    for (const st of strokes) { node.addAnnot(ctx.register(inkAnnot(st, toPdf))); count++; }
    for (const nt of notes) { node.addAnnot(ctx.register(noteAnnot(nt, toPdf, vp.rotation))); count++; }
    for (const st of stickies) { for (const o of await stickyAnnots(st, toPdf, vp.rotation)) node.addAnnot(ctx.register(o)); count++; }
  }
  // 別のファイルとして扱われるよう ID を新しくする（このアプリで開き直したとき、元の注釈が二重に表示されないように）
  const id = () => PDFHexString.of(Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''));
  ctx.trailerInfo.ID = ctx.obj([id(), id()]);
  return { bytes: await doc.save(), count };
}

let saveFile = null;
$('#miEmbed').addEventListener('click', async () => {
  closePops();
  if (!S.pdf || !S.file) { toast('PDFを開いてください'); return; }
  if (!annPages().length) { toast('埋め込む注釈（マーカー・ペン・メモ・付箋）がありません'); return; }
  showLoading(true);
  try {
    const { bytes, count } = await buildAnnotatedPdf();
    const name = S.name.replace(/\.pdf$/i, '') + '_注釈付き.pdf';
    saveFile = new File([bytes], name, { type: 'application/pdf' });
    $('#saveInfo').textContent = `${count}件の注釈を埋め込みました。\n${name}（${(bytes.length / 1e6).toFixed(1)} MB）`;
    $('#saveInfo').style.whiteSpace = 'pre-line';
    $('#saveShare').classList.toggle('hidden', !(navigator.canShare && navigator.canShare({ files: [saveFile] })));
    $('#saveModal').classList.remove('hidden');
  } catch (e) {
    console.error(e);
    toast(/encrypt/i.test(e && e.message) ? 'パスワードで保護されたPDFには埋め込めません' : '作成に失敗しました: ' + (e && e.message ? e.message : e), 4000);
  } finally { showLoading(false); }
});
const closeSaveSheet = () => { $('#saveModal').classList.add('hidden'); saveFile = null; };
$('#saveClose').addEventListener('click', closeSaveSheet);
$('#saveModal').addEventListener('pointerdown', e => { if (e.target.id === 'saveModal') closeSaveSheet(); });
$('#saveDownload').addEventListener('click', () => { if (saveFile) { download(saveFile.name, saveFile); closeSaveSheet(); } });
$('#saveShare').addEventListener('click', () => {
  if (!saveFile) return;
  navigator.share({ files: [saveFile], title: saveFile.name })
    .then(closeSaveSheet)
    .catch(e => { if (e.name !== 'AbortError') toast('共有できませんでした: ' + e.message, 3500); });
});

$('#miClear').addEventListener('click', () => {
  closePops();
  if (!S.pdf) return;
  if (!confirm('この文書のマーカー・ペン・メモ・付箋をすべて削除します。よろしいですか？\n（この操作は元に戻せません）')) return;
  ann = emptyAnn(); undoStack = []; updateUndoBtn();
  saveAnn(true); for (const el of pageEls.values()) drawAnn(el); renderSideList();
  toast('注釈をすべて削除しました');
});
$('#miFull').addEventListener('click', () => { closePops(); setFull(!full); });

// Web公開版（https）のみ Service Worker を登録してオフライン起動できるようにする
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker registration failed', e));
}
setTool('view');
updateViewPop();
updatePageUI();
renderSideListNow();
if (!isNarrow() && window.innerWidth > 1100) { /* PCではサイドバーは必要に応じて開く */ }
})();
